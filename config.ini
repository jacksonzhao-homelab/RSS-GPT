# RSS-GPT 因子情报周报 — config.ini
# 四源：QC 情报 / arXiv q-fin / awesome 量化清单 / 金工研报（缺，走 Hermes cron）

[cfg]
base = "docs/"
language = "zh"
keyword_length = "5"
summary_length = "300"

[source001]
name = "qc-intel"
url = "https://www.quantconnect.com/research.posts.sitemap.xml"
max_items = "5"
filter_apply = "link"
filter_type = "exclude"
filter_rule = "forum/discussion"

[source002]
name = "arxiv-qfin"
url = "http://export.arxiv.org/rss/q-fin.ST"
max_items = "8"
filter_apply = "title"
filter_type = "exclude"
filter_rule = "crypto|bitcoin|forecasting weather"

[source003]
name = "awesome-quant"
url = "https://github.com/wilsonfreitas/awesome-quant/releases.atom"
max_items = "3"

[source004]
name = "qc-announcements"
url = "https://www.quantconnect.com/announcements.posts.sitemap.xml"
max_items = "2"
