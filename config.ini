# RSS-GPT 因子情报周报 — config.ini
# 六源：arXiv q-fin×3（arxiv_api_rss.py 生成 raw）/ awesome-quant 提交 /
#      QC 情报(sitemap 兜底解析) / 研报源(yanbao_rss.py 生成 raw)
#
# 输入输出约定：xxx-raw.xml 是抓取脚本产出的原始条目，xxx.xml 是 main.py 的
# 摘要产物。两者绝不能同名——同名会让 main.py 把刚抓的原始条目当成
# existing_entries 跳过，永远不调 LLM。

[cfg]
base = "docs/"
language = "zh"
keyword_length = "5"
summary_length = "300"

[source001]
name = "arxiv-qfin-st"
url = "file://docs/arxiv-qfin-st-raw.xml"
max_items = "8"
filter_apply = "title"
filter_type = "exclude"
filter_rule = "(?i)crypto|bitcoin|weather|Call for Papers|Corrections"

[source002]
name = "arxiv-qfin-pm"
url = "file://docs/arxiv-qfin-pm-raw.xml"
max_items = "6"

[source003]
name = "awesome-quant"
url = "https://github.com/wilsonfreitas/awesome-quant/commits/main.atom"
max_items = "3"

[source004]
name = "qc-intel"
url = "https://www.quantconnect.com/research.posts.sitemap.xml"
max_items = "5"

[source005]
name = "yanbao"
url = "file://docs/yanbao_raw.xml"
max_items = "8"

[source006]
name = "arxiv-qfin-tr"
url = "file://docs/arxiv-qfin-tr-raw.xml"
max_items = "6"
