# RSS-GPT 因子情报周报 — config.ini
# 四源：arXiv q-fin / awesome-quant 提交 / QC 情报(本地脚本转RSS) / Hermes cron 研报(并行)

[cfg]
base = "docs/"
language = "zh"
keyword_length = "5"
summary_length = "300"

[source001]
name = "arxiv-qfin-st"
url = "https://rss.arxiv.org/rss/q-fin.ST"
max_items = "8"
filter_apply = "title"
filter_type = "exclude"
filter_rule = "crypto|bitcoin|weather|Call for Papers|Corrections"

[source002]
name = "arxiv-qfin-pm"
url = "https://rss.arxiv.org/rss/q-fin.PM"
max_items = "6"

[source003]
name = "awesome-quant"
url = "https://github.com/wilsonfreitas/awesome-quant/commits/main.atom"
max_items = "3"

[source004]
name = "qc-intel"
url = "https://www.quantconnect.com/research.posts.sitemap.xml"
max_items = "5"
